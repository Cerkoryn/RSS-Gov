# RSS-Gov study configuration. Everything a result depends on is in this file,
# the data pull it points at, and the code.

data: data/pull
results: results

programme:
  budget_ada: 5000000       # total paid over the programme
  epochs: 36                # about six months

# Definitions of measured quantities. Changing these changes what the numbers mean.
conventions:
  activity_window: 12       # epochs of closed actions that count as "recent" activity
  delegator_min_ada: 100    # smallest account that counts as a delegator
  large_ada: 100000         # accounts at or above this get their own fitted move rate
  power_floor_ada: 1000     # keeps an empty DRep choosable by movers
  prior_strength: 2         # pseudo-actions of shrinkage in a DRep's vote rate
  forecast_lag: 18          # epochs ahead that fitted vote rates must hold for (half the programme)

calibration:
  window_epochs: 40         # fit window; the held-out validation window has the same length
  fit_seeds: 12
  validation_seeds: 40
  # Largest acceptable gap between the held-out history and the model started 40 epochs
  # earlier. Relative, except turnout (absolute, in share of voting power).
  tolerances:
    tau67: 0.15
    effective_n: 0.15
    drep_power: 0.10
    abstain: 0.10
    dreps: 0.10
    turnover: 0.50
    turnout: 0.05
    supported_ratified: 0.15  # share ratified among actions with enough voter support (absolute)
    ballots: 0.20

# Not estimable from history: nobody has been paid yet. These set the scale of the
# response; the scenarios below set its strength.
assumptions:
  vote_cost_ada: 50         # effort of one considered vote; also the unit for a DRep's upkeep
  rationale_cost_ada: 100   # extra effort of publishing a rationale
  max_yield_pp: 50          # delegators ignore yield beyond this many points a year
  # Payments are CIP-159 direct deposits into reward accounts, scripted in batches: no
  # minimum amount and no claiming. One deposit adds about 40 bytes to a transaction
  # (44 lovelace a byte) plus a share of its 0.155 ADA base fee.
  payout_fee_ada: 0.002     # delivery cost of one payment

# How strongly behaviour reacts to money. One channel per trade-off, so a result can be
# traced to the assumption it rests on. With every channel at zero, paying changes nothing.
#   drep_response      DReps vote more: logit shift in vote probability per
#                      log(1 + reward per vote / vote cost).
#   delegator_response Delegators chase yield: log-weight per point of annual yield.
#   reinvest_response  Awards buy reach: a DRep's pull on movers is multiplied by
#                      (1 + award / upkeep) ^ this. Under a power-proportional rule this adds
#                      about this much to the exponent with which movers favour large DReps.
#   pledge_response    Share of the missing pledge a DRep adds over the programme when a
#                      rule ties rewards or voting power to pledge.
#   pledge_min_return  Under a pledge soft cap, a DRep adds pledge only while the extra award
#                      is at least this yearly return on the ADA added (a hurdle, not data).
#   pledge_wealth_multiple  A DRep's pledge grows to at most this multiple of the ADA in its
#                      linked accounts: how much more it could buy. Crypto is on average about
#                      a fifth of its owners' financial wealth (5x), more than half for about a
#                      fifth of owners (2x), under 15% for most (7x): Cleveland Fed WP 26-16.
#   untraced_wealth_share  Own ADA the chain cannot show: a DRep's holdings are taken to be
#                      at least this share of its voting power. The largest DReps' linked
#                      accounts are mostly small operating wallets (METHODS.md, "Pledge"), so
#                      0 is a strict lower bound; at 1% the limit hardly binds any more.
# low / central / high move all channels together; the *_only rows isolate one channel at
# its central value and are used to attribute effects, not to rank schemes.
# With every channel off, paying changes nothing (the tests check this), so that case is not run.
scenarios:
  low: {drep_response: 0.25, delegator_response: 0.5, reinvest_response: 0.1, pledge_response: 0.1,
        pledge_min_return: 0.10, pledge_wealth_multiple: 2, untraced_wealth_share: 0}
  central: {drep_response: 0.5, delegator_response: 1.0, reinvest_response: 0.2, pledge_response: 0.25,
            pledge_min_return: 0.05, pledge_wealth_multiple: 5, untraced_wealth_share: 0.001}
  high: {drep_response: 1.0, delegator_response: 2.0, reinvest_response: 0.4, pledge_response: 0.5,
         pledge_min_return: 0.02, pledge_wealth_multiple: 7, untraced_wealth_share: 0.01}
  voting_only: {drep_response: 0.5}
  yield_only: {delegator_response: 1.0}
  reinvest_only: {reinvest_response: 0.2}
  pledge_only: {pledge_response: 0.25, pledge_min_return: 0.05, pledge_wealth_multiple: 5,
                untraced_wealth_share: 0.001}
ranking_scenarios: [low, central, high]   # a scheme's score is its mean over these

# The axes schemes are compared on: one per objective family. Every axis is reported on
# its own; `ranking` below also folds them into one score, with values that are stated
# judgements. `meaningful` is the smallest difference worth acting on: smaller
# differences count as "same" even when they are statistically detectable. `scale` is
# [worst, best] as a difference from unpaid; it sets the units of the hypervolume used
# to track search progress.
axes:
  participation:
    family: Participation
    label: Delegated ADA casting an explicit vote
    better: higher
    meaningful: 0.01
    scale: [-0.05, 0.20]
  tau67:
    family: Decentralisation
    label: DReps needed for 2/3 of voting power
    better: higher
    meaningful: 1
    scale: [-5, 15]
  backing:
    family: Skin in the game
    label: Voting power backed by the DRep's pledge
    better: higher
    meaningful: 0.002
    scale: [-0.005, 0.05]
  annual_cost_ada:
    family: Reward sustainability
    label: Cost per year (ADA), from a budget or from fees
    better: lower
    meaningful: 500000
    scale: [25000000, 0]
  split_gain:
    family: Sybil resistance
    label: Share of the budget gained by splitting one identity
    better: lower
    meaningful: 0.02
    scale: [0.5, 0]   # a rule that loses half its budget to splitting covers nothing here

sybil:
  newcomer_capital_ada: 1000000   # own ADA an outsider can split over fake DReps

# A design is shortlisted only inside these limits. They are judgement calls, kept
# separate from the measurements so they can be moved without re-running anything.
# Cost and Sybil risk have no limit: like every axis, they are traded off on the front.
guardrails:
  no_axis_worse_than_unpaid: true # cost and Sybil risk excepted: they are exact trade-offs

# One score to rank designs by: net benefit in ADA a year, averaged over
# `ranking_scenarios`. What an improvement is worth is a judgement, not a measurement: these
# are starting values, and the site lets anyone change them. They give each axis's whole
# `scale` range the worth of the whole cost range (25M ADA a year), so no axis counts for
# more than another to begin with. Cost counts as itself. The ADA one actor could take by
# splitting into many DReps (`split_gain` of the yearly cost) counts as lost on top of the
# cost, `sybil_loss` ADA per ADA. Paying nothing scores 0.
ranking:
  value:                                     # ADA a year that `per` more of an axis is worth
    participation: {per: 0.01, ada: 1000000} #   1 point more of delegated ADA voting
    tau67: {per: 1, ada: 1250000}            #   1 more DRep needed to hold 2/3 of the power
    backing: {per: 0.01, ada: 4500000}       #   1 point more of the power backed by pledge
  sybil_loss: 1.0

experiment:
  seeds: 100
  schemes:
    - unpaid
    - proportional
    - equal
    - sqrt
    - capped
    - middle_out
    - activity_gate
    - rationale_bonus
    - small_drep_floor
    - delegator_flat
    - delegator_passthrough_sqrt
    - pledge_soft_cap
    - pledge_hard_cap
    # Named designs from published proposals (METHODS.md, "Named designs").
    - top_m_equal
    - top_m_proportional
    - threshold_k
    - threshold_k_proportional
    - equal_plus_power
    - exclude_k_pay_n
    - top_haircut
    - top_100_gated
    - delegators_first
    - delegator_count_sqrt
    # Simple pledge soft caps with two settings: pay for the pledge behind the votes.
    - pledge_soft_cap_skip20
    - pledge_soft_cap_skip10
    - pledge_soft_cap_capped
    # Paying delegators to move away from the largest DReps (METHODS.md, "Named designs").
    - pledge_backed_delegators
    - skip_top20_delegators
    - haircut_top20_delegators
    - small_drep_delegators
    - delegators_not_top20
    - top100_delegators_not_top20
    # The same rule at other budgets: what more or less money buys.
    - {name: capped_1m, preset: capped, budget_ada: 1000000}
    - {name: capped_2m5, preset: capped, budget_ada: 2500000}
    - {name: capped_10m, preset: capped, budget_ada: 10000000}
    # Variations of the delegator designs: pledge soft cap, how much and which DReps.
    - {name: pledge_backed_delegators_2x, preset: pledge_backed_delegators, pledge_leverage: 2}
    - {name: pledge_backed_delegators_5x, preset: pledge_backed_delegators, pledge_leverage: 5}
    - {name: pledge_backed_delegators_uncapped, preset: pledge_backed_delegators, cap_ada: null}
    - {name: pledge_backed_delegators_half, preset: pledge_backed_delegators, delegator_share: 0.5}
    - {name: skip_top10_delegators, preset: skip_top20_delegators, k_exclude: 10}
    - {name: delegators_not_top10, preset: delegators_not_top20, delegator_k_exclude: 10}
    - {name: delegators_not_top20_pledge, preset: delegators_not_top20, pledge_leverage: 1000}
    # A minimum pledge per DRep: each fake DRep then needs that much of its owner's own ADA.
    - {name: skip_top20_delegators_min_pledge, preset: skip_top20_delegators, min_pledge_ada: 10000}
    - {name: top100_delegators_not_top20_min_pledge, preset: top100_delegators_not_top20, min_pledge_ada: 10000}
    - {name: pledge_soft_cap_skip20_min_pledge, preset: pledge_soft_cap_skip20, min_pledge_ada: 10000}
    # How DReps are paid against how their delegators are: each DRep rule (proportional,
    # square root, equal) with half the budget to delegators, split across DReps by its own
    # rule (a pot per DRep by counted power, its square root, or equal) and shared per ADA.
    - {name: proportional_delegators_by_power, preset: proportional, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 1}
    - {name: proportional_delegators_sqrt, preset: proportional, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 0.5}
    - {name: proportional_delegators_equal, preset: proportional, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 0}
    - {name: sqrt_delegators_by_power, preset: sqrt, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 1}
    - {name: sqrt_delegators_sqrt, preset: sqrt, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 0.5}
    - {name: sqrt_delegators_equal, preset: sqrt, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 0}
    - {name: equal_delegators_by_power, preset: equal, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 1}
    - {name: equal_delegators_sqrt, preset: equal, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 0.5}
    - {name: equal_delegators_equal, preset: equal, delegator_share: 0.5, delegator_mode: per_drep, delegator_alpha: 0}
    # Delegator pay limited by pledge, against a flat yield that only needs some pledge.
    - {name: pledge_soft_cap_2x_delegators_flat, preset: pledge_soft_cap, pledge_leverage: 2, delegator_share: 0.5, delegator_mode: flat}
    - {name: pledge_soft_cap_2x_delegators_by_power, preset: pledge_soft_cap, pledge_leverage: 2, delegator_share: 0.5, delegator_mode: per_drep}
    - {name: skip_top20_delegators_by_power, preset: skip_top20_delegators, delegator_mode: per_drep}
    - {name: skip_top20_delegators_min_pledge_by_power, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep}
    # Around delegator pay limited by pledge (LESSONS.md, L9): does it beat a flat yield in
    # other designs; does an equal pot per pledged DRep bring splitting back; how tight
    # should the pledge limit be; how much to delegators; what more or less money buys.
    - {name: haircut_top20_delegators_by_power, preset: haircut_top20_delegators, delegator_mode: per_drep}
    - {name: delegators_not_top20_2x_flat, preset: delegators_not_top20, pledge_leverage: 2}
    - {name: delegators_not_top20_2x_by_power, preset: delegators_not_top20, pledge_leverage: 2, delegator_mode: per_drep}
    - {name: skip_top20_min_pledge_delegators_sqrt, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, delegator_alpha: 0.5}
    - {name: skip_top20_min_pledge_delegators_equal, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, delegator_alpha: 0}
    - {name: skip_top20_min_pledge_by_power_1x, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, pledge_leverage: 1}
    - {name: skip_top20_min_pledge_by_power_5x, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, pledge_leverage: 5}
    - {name: skip_top20_min_pledge_by_power_10x, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, pledge_leverage: 10}
    - {name: skip_top20_min_pledge_by_power_half, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, delegator_share: 0.5}
    - {name: skip_top20_min_pledge_by_power_2m5, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, budget_ada: 2500000}
    - {name: skip_top20_min_pledge_by_power_10m, preset: skip_top20_delegators, min_pledge_ada: 10000, delegator_mode: per_drep, budget_ada: 10000000}
    # How much goes to delegators: a fifth or four fifths instead of half.
    - {name: proportional_delegators_by_power_20, preset: proportional, delegator_share: 0.2, delegator_mode: per_drep}
    - {name: proportional_delegators_by_power_80, preset: proportional, delegator_share: 0.8, delegator_mode: per_drep}
    - {name: proportional_delegators_equal_20, preset: proportional, delegator_share: 0.2, delegator_mode: per_drep, delegator_alpha: 0}
    - {name: proportional_delegators_equal_80, preset: proportional, delegator_share: 0.8, delegator_mode: per_drep, delegator_alpha: 0}
    # Paid by a proposer fee kept from each governance action instead of a budget (CIP PR #1117): a quarter of
    # today's 100,000 ADA deposit.
    - {name: equal_plus_power_fee_25k, preset: equal_plus_power, budget_ada: 0, fee_ada: 25000}
  # Every named design above is also run with no budget, paid by each of these proposer
  # fees instead (named e.g. capped_fee_50k): all, half and a tenth of today's
  # deposit, to compare paying from a budget with paying from fees.
  fees_ada: [100000, 50000, 10000]

# The results site (`rss-gov site`), published on GitHub Pages.
site:
  repository: https://github.com/Cerkoryn/RSS-Gov  # proposals open as issues here
                            # ("Submit on GitHub"); also "suggest a change" links
  methods: METHODS.md       # rendered as the "How it works" page

search:
  seeds: 16
  generations: 10
  population: 24
  holdout_seeds: 100
  budgets_ada: [1000000, 2500000, 5000000, 10000000]
  allow_hard_fork: true     # hard-fork-only designs are searched and flagged, never shortlisted
  tries_per_holdout: 30     # new designs `rss-gov try` judges on one set of holdout seeds
                            # before it moves the front to fresh ones (search.holdout_seeds)

# The AI research loop (`rss-gov research --rounds N`; program.md). Nothing else runs it.
research:
  program: program.md
  # Run once per round; "{prompt}" becomes program.md plus the round number.
  agent: [claude, -p, "{prompt}", --allowedTools,
          "Read,Write,Edit,Bash(rss-gov static:*),Bash(rss-gov try:*)"]
