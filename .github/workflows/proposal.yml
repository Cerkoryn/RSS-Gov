# Simulate a community proposal on GitHub's runners and publish it, with no human step.
#
# A proposal arrives as an issue labelled `proposal` (the issue form adds the label, usually
# from the site's "Submit on GitHub" button). The label starts this workflow: it checks the
# rule, runs `rss-gov try`, `rss-gov rank` and `rss-gov site`, commits the result to main,
# has the site republished and comments on the issue. Any proposal can be undone by
# reverting its commit.
#
# Safeguards, because nobody reviews a proposal before it is published:
# - The issue's text is untrusted. It is only ever read from a file and checked by
#   `rss-gov submit` against proposals.FIELDS, never pasted into a command. The proposal is
#   stored as `issue_<number>` under the issue author's GitHub name; the site shows no text
#   from the issue and links to it instead.
# - The job may change nothing outside results/: it checks before pushing.
# - Each author gets PER_AUTHOR automatic runs a day and the repository PER_DAY. Above that
#   the issue waits; a maintainer adds the label `approved` (or runs this workflow by hand
#   with the issue number) to simulate it anyway.
# - `rss-gov try` moves the front to fresh holdout seeds once enough new designs have been
#   judged on them (search.tries_per_holdout), so a design accepted on luck drops out.
#   `rss-gov rank` then simulates every other design on the new seeds too, so that all
#   designs stay ranked on the same seeds; for any other proposal it has nothing to do.
name: Simulate a proposal

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number of the proposal
        required: true

permissions:
  contents: write  # commit the result to main
  issues: write    # comment on the proposal
  actions: write   # start the Pages workflow (a push by this job does not trigger it)

# `bash` (not the default `bash -e`) adds `-o pipefail`: a command that fails while piped
# into `tee` must fail its step, not hand half-finished results to the next one.
defaults:
  run:
    shell: bash

# One group per issue: proposals run side by side and each retries its push when another
# got there first, while a second run of the same issue waits for the first. (A shared
# group would keep only one waiting run and cancel the others.)
concurrency:
  group: proposal-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  simulate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["proposal", "approved"]'), github.event.label.name) &&
       contains(github.event.issue.labels.*.name, 'proposal'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      LABEL: ${{ github.event.label.name }}
      PER_AUTHOR: 3
      PER_DAY: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: |
          [[ $ISSUE =~ ^[0-9]+$ ]] || { echo "not an issue number: $ISSUE" >&2; exit 1; }
          uv sync --frozen

      - name: Check the daily limits
        id: limit
        run: |
          gh issue view "$ISSUE" --json body,author,labels > "$RUNNER_TEMP/issue.json"
          jq -r .body "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue.md"
          author=$(jq -r .author.login "$RUNNER_TEMP/issue.json")
          echo "author=$author" >> "$GITHUB_OUTPUT"
          # A maintainer's `approved` label or a run by hand is never limited.
          if [[ $LABEL == proposal ]]; then
            since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            count() { gh issue list --label proposal --state all -L 200 --search "created:>$since" "$@" --json number --jq length; }
            mine=$(count --author "$author")
            all=$(count)
            if (( mine > PER_AUTHOR || all > PER_DAY )); then
              gh issue comment "$ISSUE" --body "Thanks! More proposals than the daily limit arrived (${PER_AUTHOR} per person and ${PER_DAY} in all, over 24 hours), so this one waits for a maintainer to start it."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Simulate and commit the result
        id: proposal
        if: steps.limit.outputs.run == 'true'
        env:
          AUTHOR: ${{ steps.limit.outputs.author }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If main moved while this ran (another proposal, a refresh), start again on it.
          for attempt in 1 2 3 4 5; do
            if (( attempt > 1 )); then
              sleep $((attempt * 10))
              git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq
            fi
            tip=$(jq -r .tip_epoch results/calibration.json)
            if [[ $(jq -r .epoch_no data/pull/tip.json 2>/dev/null) != "$tip" ]]; then
              rm -rf data/pull && mkdir -p data/pull
              gh release download "data-epoch-$tip" --pattern data.tar.gz --dir "$RUNNER_TEMP" --clobber
              tar -xzf "$RUNNER_TEMP/data.tar.gz" -C data/pull
            fi
            uv run rss-gov data verify
            name=$(uv run rss-gov submit "$RUNNER_TEMP/issue.md" --name "issue_$ISSUE" --author "$AUTHOR" --source "issue #$ISSUE" 2> "$RUNNER_TEMP/refused.txt") \
              || { cat "$RUNNER_TEMP/refused.txt" >&2; exit 1; }
            [[ $name =~ ^[a-z][a-z0-9_]*$ ]] || { echo "unexpected name: $name" >&2; exit 1; }
            uv run rss-gov try "results/proposals/$name.yaml" | tee "$RUNNER_TEMP/try.log"
            uv run rss-gov rank
            uv run rss-gov site
            outside=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v '^results/' || true)
            [[ -z $outside ]] || { echo "refusing to commit files outside results/: $outside" >&2; exit 1; }
            git add results
            git commit -q -m "Simulate proposal $name (#$ISSUE)"
            if git push -q origin HEAD:main; then
              echo "name=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved during attempt $attempt; trying again on the new main" >&2
          done
          exit 1

      - name: Publish the site
        if: steps.proposal.outputs.name
        run: gh workflow run pages.yml --ref main

      - name: Report on the issue
        if: steps.proposal.outputs.name
        env:
          NAME: ${{ steps.proposal.outputs.name }}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/index.html#design=$NAME"
          verdict=$(jq -r 'if .accepted then "it adds a trade-off no other design offers, so it joins the best trade-offs on the site" else "it does not add a new trade-off (\(.reason))" end' "results/proposals/$NAME.json")
          {
            echo "Simulated: $verdict."
            echo
            echo "It is on the site, next to every other design, a minute or two after this comment: $url"
            echo
            echo '```'
            { grep -v '^wrote ' "$RUNNER_TEMP/try.log" || true; } | tail -n 40
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$ISSUE" --reason completed

      - name: Report a failure
        if: failure()
        run: |
          {
            echo "The simulation did not finish."
            if [ -s "$RUNNER_TEMP/refused.txt" ]; then
              echo
              echo '```'
              cat "$RUNNER_TEMP/refused.txt"
              echo '```'
              echo
              echo "Fix the rule and submit it again as a new proposal (the Propose page fills it in)."
            fi
            echo
            echo "Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/failed.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/failed.md"
