[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rss-gov"
version = "1.0.0"
description = "Calibrated, replicated simulation of Cardano governance reward schemes"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "PyYAML>=6.0.2,<7", "numpy>=2,<3",
  "pandas>=2.2,<4", "pyarrow>=19,<24",
  "matplotlib>=3.9,<4", "Markdown>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
rss-gov = "rss_gov.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_gov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
