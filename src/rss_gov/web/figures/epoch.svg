<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" role="img" aria-label="One epoch of a simulated programme, in six steps that repeat: balances drift; DReps come and go; the rule pays; DReps react; delegators move; actions are voted on. Then the next epoch starts.">
  <defs>
    <marker id="head-epoch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- row 1, left to right -->
  <rect class="box" x="8" y="16" width="212" height="96" rx="10"/>
  <rect class="hist" x="13" y="28" width="4" height="72" rx="2"/>
  <text class="t" x="28" y="44">1  Balances drift</text>
  <text x="28" y="68">Account balances grow and</text>
  <text x="28" y="86">wobble as they have on chain.</text>

  <rect class="box" x="254" y="16" width="212" height="96" rx="10"/>
  <rect class="hist" x="259" y="28" width="4" height="72" rx="2"/>
  <circle class="react" cx="450" cy="32" r="5"/>
  <text class="t" x="274" y="44">2  DReps come and go</text>
  <text x="274" y="68">New DReps register and some</text>
  <text x="274" y="86">retire, at historical rates.</text>

  <rect class="box rule" x="500" y="16" width="212" height="96" rx="10"/>
  <rect class="pay" x="505" y="28" width="4" height="72" rx="2"/>
  <text class="t" x="520" y="44">3  The rule pays</text>
  <text x="520" y="68">Pays DReps that voted lately</text>
  <text x="520" y="86">(and, by some rules, delegators).</text>

  <!-- row 2, right to left -->
  <rect class="box" x="500" y="172" width="212" height="96" rx="10"/>
  <rect class="react" x="505" y="184" width="4" height="72" rx="2"/>
  <text class="t" x="520" y="200">4  DReps react</text>
  <text x="520" y="224">Vote more, add own stake, buy</text>
  <text x="520" y="242">reach: the assumed reactions.</text>

  <rect class="box" x="254" y="172" width="212" height="96" rx="10"/>
  <rect class="hist" x="259" y="184" width="4" height="72" rx="2"/>
  <circle class="react" cx="450" cy="188" r="5"/>
  <text class="t" x="274" y="200">5  Delegators move</text>
  <text x="274" y="224">A few accounts re-delegate,</text>
  <text x="274" y="242">favouring big, active DReps.</text>

  <rect class="box" x="8" y="172" width="212" height="96" rx="10"/>
  <rect class="hist" x="13" y="184" width="4" height="72" rx="2"/>
  <circle class="react" cx="204" cy="188" r="5"/>
  <text class="t" x="28" y="200">6  Actions are voted on</text>
  <text x="28" y="224">Each DRep votes with its own</text>
  <text x="28" y="242">chance; outcomes are tallied.</text>

  <!-- arrows -->
  <line class="line" x1="222" y1="64" x2="250" y2="64" marker-end="url(#head-epoch)"/>
  <line class="line" x1="468" y1="64" x2="496" y2="64" marker-end="url(#head-epoch)"/>
  <line class="line" x1="606" y1="114" x2="606" y2="168" marker-end="url(#head-epoch)"/>
  <line class="line" x1="498" y1="220" x2="470" y2="220" marker-end="url(#head-epoch)"/>
  <line class="line" x1="252" y1="220" x2="224" y2="220" marker-end="url(#head-epoch)"/>
  <line class="line" x1="114" y1="170" x2="114" y2="116" marker-end="url(#head-epoch)"/>
  <text class="n" x="124" y="147">next epoch</text>

  <!-- what is measured -->
  <rect class="box" x="8" y="290" width="704" height="70" rx="10"/>
  <text x="24" y="311"><tspan class="t" style="font-size:12px">Measured along the way:</tspan> participation on every action in step 6; how spread out voting power is,</text>
  <text x="24" y="330">and how much of it is the DReps' own ADA, at the end of each epoch; the cost from what step 3 pays.</text>
  <text x="24" y="349">Sybil risk is not simulated: it is computed exactly from the rule and today's chain.</text>

  <!-- legend -->
  <rect class="hist" x="8" y="382" width="14" height="6" rx="2"/>
  <text class="n" x="28" y="388">Fitted to chain history</text>
  <rect class="pay" x="186" y="382" width="14" height="6" rx="2"/>
  <text class="n" x="206" y="388">The reward rule</text>
  <rect class="react" x="320" y="382" width="14" height="6" rx="2"/>
  <text class="n" x="340" y="388">Assumed reactions to rewards</text>
  <circle class="react" cx="537" cy="385" r="5"/>
  <text class="n" x="548" y="388">Also nudged by those reactions</text>
</svg>
