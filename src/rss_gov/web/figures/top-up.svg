<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="How a DRep adds pledge each epoch under a rule that counts only a multiple of its pledge: work out what is missing, take a small step toward it, stop at what it could afford, and add the step only if the extra reward pays the minimum return. If so, the ADA counts as its pledge and joins its voting power; otherwise nothing is added this epoch.">
  <defs>
    <marker id="head-topup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="8" y="16" width="160" height="138" rx="10"/>
  <text class="t" x="22" y="42">1  What is missing</text>
  <text x="22" y="66">Pledge needed so</text>
  <text x="22" y="84">all its power counts</text>
  <text x="22" y="102">(up to any pay cap),</text>
  <text x="22" y="120">minus what it has now.</text>

  <rect class="box" x="189" y="16" width="160" height="138" rx="10"/>
  <text class="t" x="203" y="42">2  This epoch's step</text>
  <text x="203" y="66">A small share of the</text>
  <text x="203" y="84">gap, set by the</text>
  <text x="203" y="102">scenario: e.g. a quarter</text>
  <text x="203" y="120">of it over the whole</text>
  <text x="203" y="138">programme.</text>

  <rect class="box" x="370" y="16" width="160" height="138" rx="10"/>
  <text class="t" x="384" y="42">3  Can it afford it?</text>
  <text x="384" y="66">Pledge stops at a</text>
  <text x="384" y="84">multiple of the ADA in</text>
  <text x="384" y="102">its linked accounts:</text>
  <text x="384" y="120">2×, 5× or 7×, from the</text>
  <text x="384" y="138">low to the high scenario.</text>

  <rect class="box" x="551" y="16" width="160" height="138" rx="10"/>
  <text class="t" x="565" y="42">4  Does it pay?</text>
  <text x="565" y="66">Extra reward a year must</text>
  <text x="565" y="84">be at least 10%, 5% or</text>
  <text x="565" y="102">2% of the ADA added.</text>
  <text x="565" y="120">A hard cap skips this:</text>
  <text x="565" y="138">its power depends on it.</text>

  <line class="line" x1="170" y1="85" x2="186" y2="85" marker-end="url(#head-topup)"/>
  <line class="line" x1="351" y1="85" x2="367" y2="85" marker-end="url(#head-topup)"/>
  <line class="line" x1="532" y1="85" x2="548" y2="85" marker-end="url(#head-topup)"/>
  <line class="line" x1="631" y1="156" x2="631" y2="190" marker-end="url(#head-topup)"/>
  <text class="n" x="639" y="178">yes</text>
  <path class="line" d="M585 156 V172 H178 V190" marker-end="url(#head-topup)"/>
  <text class="n" x="186" y="186">no</text>

  <rect class="box yes" x="370" y="194" width="341" height="56" rx="10"/>
  <text class="t" x="384" y="217">It adds the step.</text>
  <text x="384" y="237">The ADA counts as its pledge and votes with it.</text>

  <rect class="box" x="8" y="194" width="341" height="56" rx="10"/>
  <text class="t" x="22" y="217">Otherwise nothing is added this epoch.</text>
  <text x="22" y="237">Next epoch it looks again, with the new numbers.</text>
</svg>
